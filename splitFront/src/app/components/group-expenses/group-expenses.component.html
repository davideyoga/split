<!-- Niente intestazione: il segmento "Spese" sopra dice gia' cosa c'e'. -->
@if (loading) {
  <p class="ion-padding-horizontal">{{ 'groups.expenses-loading' | translate }}</p>
} @else if (loadError) {
  <p class="ion-padding-horizontal">{{ 'groups.expenses-load-error' | translate }}</p>
} @else if (expenses.length === 0) {
  <p class="ion-padding-horizontal">{{ 'groups.no-expenses' | translate }}</p>
  <div class="ion-padding-horizontal">
    <ion-button fill="outline" (click)="addExpense.emit()">
      {{ 'groups.add-first-expense' | translate }}
    </ion-button>
  </div>
} @else {
  <app-expense-list
    [expenses]="expenses"
    [detailPath]="['/tabs/groups', groupPublicId, 'expense']"
    [showGroup]="false"
  ></app-expense-list>
}
