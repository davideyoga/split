<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">{{ 'groups.cancel' | translate }}</ion-button>
    </ion-buttons>
    <ion-title>{{ 'groups.new-group' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        [strong]="true"
        [disabled]="groupForm.invalid || saving"
        (click)="createGroup()"
      >
        {{ 'groups.create' | translate }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="groupForm">
    <ion-list>
      <ion-item>
        <ion-input
          label="{{ 'groups.name-label' | translate }}"
          labelPlacement="floating"
          type="text"
          formControlName="name"
          placeholder="{{ 'groups.name-placeholder' | translate }}"
        ></ion-input>
      </ion-item>
      <ion-item lines="none">
        <ion-label class="ion-text-wrap">
          <p>{{ 'groups.invite-after-create' | translate }}</p>
        </ion-label>
      </ion-item>
    </ion-list>

    @if (errorMessage) {
      <ion-text color="danger">
        <p class="ion-padding-start">{{ errorMessage | translate }}</p>
      </ion-text>
    }
  </form>
</ion-content>
