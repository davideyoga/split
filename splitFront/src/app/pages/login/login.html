<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ 'login.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="loginForm" (ngSubmit)="submit()">
    <ion-list>
      <ion-item>
        <ion-input
          label="{{ 'login.email-label' | translate }}"
          labelPlacement="floating"
          type="email"
          formControlName="email"
          placeholder="{{ 'login.email-placeholder' | translate }}"
        ></ion-input>
      </ion-item>
    </ion-list>

    @if (errorMessage) {
      <ion-text color="danger">
        <p class="ion-padding-start">{{ errorMessage | translate }}</p>
      </ion-text>
    }

    <div class="ion-padding-top ion-text-center">
      <ion-button type="submit" [disabled]="loginForm.invalid">
        {{ 'login.submit' | translate }}
      </ion-button>
    </div>
  </form>
</ion-content>
