<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Split</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- PWA: manifest + colore della barra di sistema (toolbar Ionic chiara / scura md) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1f1f" />

    <!-- add to homescreen for ios -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Split" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Splash di avvio: visibile da subito, prima che arrivino JS e CSS, e
         tolto da AppComponent quando la prima pagina e le traduzioni sono
         pronte. CSS inline perche' i fogli di stile possono non essere ancora
         arrivati; colori presi a mano da theme/variables.scss. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #ffffff;
        transition: opacity 200ms ease-out;
      }
      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash svg {
        border-radius: 18px;
      }
      #boot-splash .dots {
        display: flex;
        gap: 8px;
      }
      #boot-splash .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0f5e56;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      #boot-splash .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot-splash .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .dots span {
          animation: none;
          opacity: 0.6;
        }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: #111716;
        }
        #boot-splash .dots span {
          background: #5eead4;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-busy="true">
      <!-- Il logo (splitFront/icon/icon.svg), come in cima al login. -->
      <svg viewBox="0 0 100 100" width="72" height="72" role="img" aria-label="Split">
        <rect width="100" height="100" fill="#0F5E56" />
        <path d="M69.8 30.2A28 28 0 0 0 30.2 69.8Z" transform="translate(-3 -3)" fill="#5EEAD4" />
        <path d="M69.8 30.2A28 28 0 0 1 30.2 69.8Z" transform="translate(3 3)" fill="#FFFFFF" />
      </svg>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <app-root></app-root>
  </body>
</html>
